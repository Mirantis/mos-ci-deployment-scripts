chase_referrals: 'False'
domain: openldap1.tld
group_desc_attribute: description
group_filter: ''
group_id_attribute: cn
group_member_attribute: member
group_name_attribute: cn
group_objectclass: groupOfNames
group_tree_dn: dc=openldap1,dc=tld
ldap_proxy: false
ldap_proxy_custom_conf: |
  config_for=base_config
  include         /etc/ldap/schema/core.schema
  include         /etc/ldap/schema/cosine.schema
  include         /etc/ldap/schema/inetorgperson.schema
  include         /etc/ldap/schema/nis.schema
  modulepath /usr/lib/ldap
  moduleload back_ldap
  pidfile /var/run/slapd/slapd.pid
  argsfile /var/run/slapd/slapd.args
  #rebind-as-user
  #loglevel 0
  loglevel -1

  config_for=keystone2.tld
  database#         ldap
  #its custom config
  suffix "dc=keystone2,dc=tld"
  readonly yes
  # protocol-version 3
  uri "ldap://172.16.56.26"
  rootdn "dc=keystone2,dc=tld"#
  idassert-bind   bindmethod=simple
                  binddn="CN=Administrator,CN=Users,DC=keystone2,DC=tld"#
                  credentials="qwerty123!!"
                  mode=none
  #               idassert-authzFrom "*"

  config_for=mirantis.tld
  database ldap
  #its custom# config
  suffix "dc=mirantis,dc=tld"
  readonly yes
  protocol-version 3
  # uri "ldap://172.18.196.224"
  rootdn "dc=mirantis,dc=tld"
  idassert-bind#  bindmethod=simple
                  binddn="cn=admin,dc=mirantis,dc=tld"#
                  credentials="1111"
                  mode=none
  idassert-authzFrom#
page_size: '0'
password: qwerty123!
query_scope: sub
suffix: dc=openldap1,dc=tld
url: ldap://172.16.56.27
use_tls: true
user: cn=admin,dc=openldap1,dc=tld
user_enabled_attribute: enabled
user_filter: ''
user_id_attribute: cn
user_name_attribute: sn
user_objectclass: inetOrgPerson
user_pass_attribute: userPassword
user_tree_dn: dc=openldap1,dc=tld
