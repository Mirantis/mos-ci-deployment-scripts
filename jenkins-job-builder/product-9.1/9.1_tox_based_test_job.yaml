- common_parameters: &common_parameters
    name: 'common tox based project parameters'
    description: 'Tox based jobs with deploy for milestone {milestone}'
    weight: 4
    milestone: '9.1'
    iso_dir: /var/www/fuelweb-iso
    suite: '[{milestone}][MOSQA] Tempest {milestone}'
    start_timer: ''
    #start_timer: '0 21 * * *'
    tox_propertires: ''
    jobs:
      - '{milestone}_{name}'

- project:
    name: Ceilometer
    weight: 2
    env_changer: _ceilometer
    env_inject_file: env_inject_ceilometer.properties
    config_path: templates/ceilometer/default.yaml
    test_group: Ceilometer
    report_prefix: /srv/jenkins/ceilometer
    node: single_template
    description: Ceilometer tests
    display_name: '{milestone}_{name}'
    tox_test_name: ceilometer
    nova_quotas: "FALSE"
    <<: *common_parameters

