- common_parameters: &common_parameters
    name: 'common tox based wo deplopy project parameters'
    description: 'Tox based jobs without deploy for milestone {milestone}'
    weight: 4
    milestone: '9.1'
    iso_dir: /var/www/fuelweb-iso
    suite: '[{milestone}][MOSQA] Tempest {milestone}'
    start_timer: ''
    #start_timer: '0 22 * * *'
    tox_properties: ''
    jobs:
      - '{milestone}_wo_deploy_{name}'

- project:
    name: keystone
    weight: 2
    env_changer: _glance_swift
    env_inject_file: env_inject_vlan_keystone.properties
    config_path: templates/glance/swift.yaml
    test_group: Keystone
    node: Slave-srv135
    display_name: '{milestone}_{name}'
    tox_test_name: keystone
    <<: *common_parameters

