- job-template:
    name: generate_snapshot_rc

    project-type: freestyle
    node: 'cz5443.bud.mirantis.net'
    triggers:
        - timed: "0 21 * * *"

    description: 'Generate snapshot.rc (with snapshot information)'
    display-name: 'Generate snapshot.rc'
    concurrent: true
    retry-count: 3
    logrotate:
      daysToKeep: 1

    snapshot_rc_path: snapshot.rc


    wrappers:
      - inject:
          properties-content: |
              ENV_INJECT_PATH={snapshot_rc_path}

    builders:
        - shell:
            !include-raw-escape: ../shell_scripts/get_snapshots.sh

    publishers:
      - raw:
          xml:
            <com.michelin.cio.hudson.plugins.copytoslave.CopyToMasterNotifier plugin="copy-to-slave@1.4.4">
            <includes>{snapshot_rc_path}</includes>
            <excludes/>
            <overrideDestinationFolder>false</overrideDestinationFolder>
            <destinationFolder/>
            <runAfterResultFinalised>true</runAfterResultFinalised>
            </com.michelin.cio.hudson.plugins.copytoslave.CopyToMasterNotifier>
      # - copy-to-master:
      #     includes:
      #       - '{snapshot_rc_path}'
      - workspace-cleanup:
          fail-build: false
      - email:
          recipients: gdyuldin@mirantis.com

- project:
    name: generate_snapshot_rc
    jobs:
      - generate_snapshot_rc
