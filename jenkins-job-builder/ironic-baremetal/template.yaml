# Macros
- builder:
    name: erase_environments
    builders:
      - shell:
          !include-raw: ../shell_scripts/template_scripts/erase_ci_envs.sh

- builder:
    name: set_base_env_variables
    builders:
      - shell:
          !include-raw: ../shell_scripts/template_scripts/env_variables_export.sh
      - shell: |
          export ENV_CHANGER={env_changer}
          export CONFIG_PATH={config_path}

          env > "$ENV_INJECT_PATH"

- builder:
    name: get_plugins
    builders:
      - inject:
          properties-file: "$ENV_INJECT_PATH"
      - shell:
          !include-raw-escape: ../shell_scripts/get_plugins.sh

- builder:
    name: deploy_env
    builders:
      - inject:
          properties-file: "$ENV_INJECT_PATH"
      - shell:
          !include-raw: ../shell_scripts/deploy_env_from_template.sh

- builder:
    name: setup_baremetal_bridge
    builders:
      - inject:
          properties-file: "$ENV_INJECT_PATH"
      - shell: |
          BAREMETAIL_IFACE=em2
          IRONIC_NET=${{ENV_NAME}}_ironic
          IRONIC_BRIDGE=$(virsh net-dumpxml $IRONIC_NET | xmllint --xpath 'string(//bridge/@name)' - )

          sudo brctl addif $IRONIC_BRIDGE $BAREMETAIL_IFACE
          sudo brctl stp fuelbr0 off

          env > "$ENV_INJECT_PATH"


- builder:
    name: teardown_baremetal_bridge
    builders:
      - inject:
          properties-file: "$ENV_INJECT_PATH"
      - shell: sudo brctl delif $IRONIC_BRIDGE $BAREMETAIL_IFACE

- builder:
    name: set_ironic_env_variables
    builders:
      - shell: |
          export IRONIC_NODES_CONFIG=/home/jenkins/src/ironic_nodes_{baremetal_node_group}.yaml
          export IRONIC_IMAGE_URL=/home/jenkins/images/dib-user-image-dkms-grub.raw

          env > "$ENV_INJECT_PATH"


- builder:
    name: run_tox_tests
    builders:
      - inject:
          properties-file: "$ENV_INJECT_PATH"
      - shell:
          !include-raw: ../shell_scripts/template_scripts/tox_based_test_runner.sh

- builder:
    name: report_to_testrail
    builders:
      - shell:
          export TEST_GROUP={testrail_env_description}

          env > "$ENV_INJECT_PATH"
      - inject:
          properties-file: "$ENV_INJECT_PATH"
      - shell:
          !include-raw: ../shell_scripts/template_scripts/testrail_reporter.sh

- job-template:
    name: '9.x_ironic_{deploy_template}'
    display_name: '{obj:name}'

    defaults: common_job_settings
    weight: 1

    builders:
        - erase_environments
        - set_base_env_variables:
            env_changer: '{env_changer}'
            config_path: '{config_path}'
        - get_plugins
        - deploy_env
        - setup_baremetal_bridge
        - set_ironic_env_variables:
            baremetal_node_group: '{baremetal_node_group}'
        - run_tox_tests
        - teardown_baremetal_bridge
        - report_to_testrail:
            testrail_env_description: '{testrail_env_description}'

    wrappers:
      - ansicolor
      - inject-passwords:
          global: true
          mask-password-params: true


    publishers:
        - common_publisher
        - archive:
            artifacts: 'mos-integration-tests/snapshots/*'
            allow-empty: 'true'
            fingerprint: true

- project:
    name: ironic-tests
    description: 'Ironic tests with baremetal nodes'
    node: 'cz5443.bud.mirantis.net'
    deploy_template:
      - Ceph_DVR_Sahara_Ceilometer:
          config_path: 'templates/tempest/ironic_ceph.yaml'
          start_timer: '5 21 * * *'
          env_changer: 'ceph'
          baremetal_node_group: 1

      - LVM_Cinder_DVR_Sahara_Ceilometer:
          config_path: 'templates/tempest/ironic_cinder.yaml'
          start_timer: '10 21 * * *'
          env_changer: 'cinder'
          baremetal_node_group: 2

    display_name: 'Ironic_9.x_{deploy_template}'
    testrail_env_description: 'Ironic_baremetal_{deploy_template}'
    jobs:
      - 9.x_ironic_{deploy_template}
