- job-template:
    name: 'stepler_mk22'

    defaults: common_job_settings

    parameters:
        - common_parameters
        - string:
            name: CFG_NODE_IP
            default: '172.16.10.100'

    scm:
        - git:
            url: https://github.com/Mirantis/mos-ci-deployment-scripts.git
            branches:
                - origin/master

    builders:
        - shell:
            !include-raw-escape: ../shell_scripts/run_stepler.sh

    properties:
      - heavy-job:
          weight: 4

- project:
    name: stepler-mk22
    node: 'cloud_TCP_cloud'
    start_timer: ''
    display_name: 'Run stepler on MK22'
    jobs:
      - stepler_mk22
