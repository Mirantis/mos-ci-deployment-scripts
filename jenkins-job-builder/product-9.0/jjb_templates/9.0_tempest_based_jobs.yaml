- job-template:
    name: '9.0_tempest_{name}'

    wrappers:
      - build-name:
          name: ${{BUILD_NUMBER}}.${{FILE,path="build-name-setter.info"}}

    properties:
      - heavy-job:
          weight: '{weight}'

    parameters:
        #EnvInject file
        - string:
            name: ENV_INJECT_PATH
            default: '{env_inject_file}'

        ##### Environment parameters #####
        - string:
            name: ISO_DIR
            default: "/var/www/fuelweb-iso"
        - string:
            name: ENV_CHANGER
            default: '{env_changer}'
        - string:
            name: DISABLE_SSL
            default: "TRUE"
        - string:
            name: NOVA_QUOTAS_ENABLED
            default: "TRUE"
        - string:
            name: DEPLOYMENT_TIMEOUT
            default: "10000"
        - string:
            name: CONFIG_PATH
            default: '{config_path}'
        - string:
            name: PARSED_PLUGINS_LINK
            default: "http://jenkins-product.srt.mirantis.net:8080/view/plugins/job/build-fuel-plugins/"
        - string:
            name: PLUGINS_DIR
            default: "/var/www/detach-plugins"

        ##### TestRail Parameters #####
        - string:
            name: TESTRAIL_TEMPLATE_ALTER
            default: "FALSE"
        - string:
            name: TEST_GROUP
            default: '{test_group}'
        - string:
            name: TESTRAIL_FILE
            default: "/var/www/test_rail/user.sh"
        - string:
            name: REPORT_PREFIX
            default: '{report_prefix}'
        - string:
            name: REPORT_FILE
            default: '{report_file}'
        - string:
            name: SUITE
            default: "[9.0][MOSQA] Tempest 9.0 Mitaka"
        - string:
            name: MILESTONE
            default: "9.0"
        - string:
            name: TEMPEST
            default: "FALSE"
            #####For tempest running on master#####
            #####default: "TRUE"                  #
            #######################################
        - string:
            name: TESTRAIL_TEMPEST
            default: "TRUE"


    builders:
        - shell:
            !include-raw: ../../shell_scripts/template_scripts/erase_ci_envs.sh
        - shell:
            !include-raw: ../../shell_scripts/template_scripts/env_variables_export.sh
        - inject:
            properties-file: "$ENV_INJECT_PATH"
        - shell:
            !include-raw: ../../shell_scripts/get_plugins.sh
        - inject:
            properties-file: "$ENV_INJECT_PATH"
        - shell:
            !include-raw: ../../shell_scripts/template_scripts/deploy_template_env.sh
        - inject:
            properties-file: "$ENV_INJECT_PATH"
        - shell:
            !include-raw-escape: ../../shell_scripts/template_scripts/get_fuel_master_ip.sh
        - inject:
            properties-file: "$ENV_INJECT_PATH"
        - shell:
            !include-raw-escape: ../../shell_scripts/tempest_tests.sh
        - inject:
            properties-file: "$ENV_INJECT_PATH"
        - shell:
            !include-raw: ../../shell_scripts/template_scripts/testrail_reporter.sh

    #triggers:
    #    - timed: '{start_timer}'

    defaults: global
    node: '{node}'
    description: '{description}'
    disabled: false
    display-name: '{display_name}'
    concurrent: false
    retry-count: 3
    logrotate:
      daysToKeep: 30
      artifactDaysToKeep: -1
      artifactNumToKeep: -1

    publishers:
      - email:
          recipients: '{email-recipients}'

      - postbuildscript:
          script-only-if-succeeded: False

      - archive:
          artifacts: 'report.xml'
          allow-empty: 'true'
          fingerprint: true

      - archive:
          artifacts: 'mos-integration-tests/snapshots/*'
          allow-empty: 'true'
          fingerprint: true

      - archive:
          artifacts: '*.log'
          allow-empty: 'true'
          fingerprint: true

      - junit:
          results: report.xml

      - workspace-cleanup:
          fail-build: false


- project:
    name: cinder_ironic_and_Co_no_ssl 
    weight: 2
    iso_dir: /var/www/fuelweb-iso
    env_changer: _ironic_cinder 
    env_inject_file: env_inject_tempest_cinder_no_ssl.properties
    config_path: templates/tempest/ironic_cinder.yaml
    test_group: Tempest_cinder_ironic_and_Co_no_ssl
    report_prefix: /srv/jenkins/tempest_cinder_no_ssl
    report_file: report.xml
    start_timer: "0 21 * * *"
    node: Slave-srv136
    description: Tempest tests 
    display_name: '9.0_tempest_{name}'
    email-recipients: ogubanov@mirantis.com
    jobs:
      - '9.0_tempest_{name}'

